name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: csharpnumerics/package-lock.json

      - name: Install dependencies
        working-directory: csharpnumerics
        run: npm ci

      - name: Build Docusaurus
        working-directory: csharpnumerics
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          # Copy CNAME for custom domain
          cp CNAME _site/ 2>/dev/null || true
          # Copy root static files
          cp index.html style.css styles.css _site/ 2>/dev/null || true
          cp cv.md cv.pdf _cv.pdf _site/ 2>/dev/null || true
          # Copy static project folders
          cp -r img _site/ 2>/dev/null || true
          cp -r exoplanethunter _site/ 2>/dev/null || true
          cp -r groupedtimeseriecv _site/ 2>/dev/null || true
          cp -r quantumcircuit _site/ 2>/dev/null || true
          cp -r csharpnumerics-2 _site/ 2>/dev/null || true
          # Copy Docusaurus build output
          mkdir -p _site/csharpnumerics
          cp -r csharpnumerics/build/* _site/csharpnumerics/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
