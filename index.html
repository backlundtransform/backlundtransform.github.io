<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio – Backlund Transform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-8 min-h-screen">

  <header class="text-center mb-12">
    <div class="relative w-72 h-24 mx-auto mb-4">
      <img src="img/logo.png" alt="Logo" class="object-contain w-full h-full">
    </div>
    <p class="text-slate-300 text-lg max-w-2xl mx-auto">
      Turning complex ideas into clear insights – from theory to code.
    </p>
    <div class="mt-6 flex justify-center gap-4">
      <a href="/cv.pdf" download class="bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-2 px-4 rounded-lg transition">
        Download CV
      </a>
    </div>
  </header>

  <section id="projects" class="grid sm:grid-cols-2 lg:grid-cols-2 gap-6 max-w-6xl mx-auto">
    <!-- Projects are generated here by JavaScript -->
  </section>

  <footer class="text-center text-slate-500 mt-16">
    <p>© <span id="year"></span> Backlund Transform — From theory to code.</p>
    <p><a href="https://github.com/backlundtransform" class="hover:underline">GitHub</a></p>
    <p><a href="https://www.linkedin.com/in/g%C3%B6ran-b%C3%A4cklund-b4343b3b/" class="hover:underline">LinkedIn</a></p>
  </footer>

  <script>
    // Project database
    const projects = [
      {
        title: "ExoplanetHunter",
        description: "A project combining data analysis and visualization to identify and simulate exoplanet systems.",
        tags: ["Python", "React", "Three.js", "Astronomy"],
        link: "https://exoplanethunter.com/"
      },
      {
        title: "CSharpNumerics",
        description: "A C# library for numerical analysis with a focus on efficiency and precision in scientific computing.",
        tags: ["C#", "Numerical Analysis", ".NET"],
        link: "csharpnumerics/"
      }
    ];

    const projectsContainer = document.getElementById('projects');

    // Create HTML for each project
    projects.forEach(proj => {
      const card = document.createElement('div');
      card.className = 'bg-slate-900 border-slate-800 hover:shadow-xl transition p-6';

      card.innerHTML = `
        <h2 class="text-xl font-semibold mb-2 text-cyan-400">${proj.title}</h2>
        <p class="text-slate-300 mb-4">${proj.description}</p>
        <div class="flex flex-wrap gap-2 mb-4">
          ${proj.tags.map(tag => `<span class="bg-slate-800 text-xs px-2 py-1 rounded-full text-slate-200">${tag}</span>`).join('')}
        </div>
        <a href="${proj.link}" class="text-cyan-400 hover:underline text-sm">View more</a>
      `;

      projectsContainer.appendChild(card);
    });

    // Display current year in footer
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
