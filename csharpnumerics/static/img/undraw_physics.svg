<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Pendulum simulation -->
  
  <!-- Pivot point -->
  <circle cx="100" cy="40" r="4" fill="currentColor"/>
  
  <!-- Pendulum rod -->
  <line x1="100" y1="40" x2="140" y2="120" stroke="currentColor" stroke-width="2"/>
  
  <!-- Pendulum bob -->
  <circle cx="140" cy="120" r="12" fill="#1c7ed6" stroke="currentColor" stroke-width="2"/>
  
  <!-- Motion arc -->
  <path d="M 60 120 A 80 80 0 0 1 140 120" stroke="#2e8555" stroke-width="1.5" stroke-dasharray="4,3" fill="none" opacity="0.5"/>
  
  <!-- Velocity vector -->
  <line x1="140" y1="120" x2="165" y2="105" stroke="#f56e28" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Force vectors -->
  <line x1="140" y1="120" x2="140" y2="155" stroke="#e03e3e" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Angle arc -->
  <path d="M 100 60 A 20 20 0 0 1 110 75" stroke="currentColor" stroke-width="1" fill="none" opacity="0.6"/>
  
  <!-- Labels -->
  <text x="168" y="108" font-family="serif" font-style="italic" font-size="11" fill="#f56e28">v</text>
  <text x="145" y="165" font-family="serif" font-style="italic" font-size="11" fill="#e03e3e">F</text>
  <text x="105" y="72" font-family="serif" font-size="10" fill="currentColor" opacity="0.7">θ</text>
  
  <!-- Coordinate system in corner -->
  <line x1="30" y1="170" x2="50" y2="170" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="170" x2="30" y2="150" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <text x="52" y="173" font-family="serif" font-size="8" fill="currentColor" opacity="0.5">x</text>
  <text x="25" y="146" font-family="serif" font-size="8" fill="currentColor" opacity="0.5">y</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f56e28"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e03e3e"/>
    </marker>
  </defs>
</svg>
