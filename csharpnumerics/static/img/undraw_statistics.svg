<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Bar chart base line -->
  <line x1="40" y1="160" x2="160" y2="160" stroke="currentColor" stroke-width="2"/>
  
  <!-- Bars -->
  <rect x="45" y="120" width="20" height="40" fill="#1c7ed6" opacity="0.8"/>
  <rect x="70" y="90" width="20" height="70" fill="#1c7ed6" opacity="0.8"/>
  <rect x="95" y="70" width="20" height="90" fill="#2e8555" opacity="0.9"/>
  <rect x="120" y="100" width="20" height="60" fill="#1c7ed6" opacity="0.8"/>
  <rect x="145" y="130" width="20" height="30" fill="#1c7ed6" opacity="0.8"/>
  
  <!-- Normal distribution curve overlay -->
  <path d="M 40 140 Q 70 80, 105 60 T 165 150" stroke="#f56e28" stroke-width="2.5" fill="none" opacity="0.7"/>
  
  <!-- Mean line -->
  <line x1="105" y1="50" x2="105" y2="165" stroke="#e03e3e" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  
  <!-- Data points on curve -->
  <circle cx="105" cy="60" r="3" fill="#f56e28"/>
  
  <!-- Labels -->
  <text x="95" y="180" font-family="sans-serif" font-size="10" fill="currentColor" opacity="0.7">μ</text>
</svg>
