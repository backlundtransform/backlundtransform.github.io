<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Monitor frame -->
  <rect x="30" y="25" width="140" height="105" rx="6" stroke="currentColor" stroke-width="2" fill="none"/>
  <rect x="75" y="130" width="50" height="8" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <line x1="100" y1="130" x2="100" y2="125" stroke="currentColor" stroke-width="1.5"/>

  <!-- Bar chart inside monitor -->
  <rect x="48" y="95" width="14" height="25" rx="2" fill="#22d3ee" opacity="0.6"/>
  <rect x="68" y="75" width="14" height="45" rx="2" fill="#22d3ee" opacity="0.75"/>
  <rect x="88" y="60" width="14" height="60" rx="2" fill="#22d3ee" opacity="0.9"/>
  <rect x="108" y="50" width="14" height="70" rx="2" fill="#22d3ee"/>
  <rect x="128" y="65" width="14" height="55" rx="2" fill="#22d3ee" opacity="0.8"/>

  <!-- Trend line overlay -->
  <path d="M 55 90 Q 82 68, 95 55 T 135 45" stroke="#2e8555" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="55" cy="90" r="2.5" fill="#2e8555"/>
  <circle cx="95" cy="55" r="2.5" fill="#2e8555"/>
  <circle cx="135" cy="45" r="2.5" fill="#2e8555"/>

  <!-- Axis inside monitor -->
  <line x1="42" y1="120" x2="152" y2="120" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="42" y1="38" x2="42" y2="120" stroke="currentColor" stroke-width="1" opacity="0.4"/>

  <!-- Floating data nodes (domain modules) -->
  <circle cx="45" cy="155" r="6" stroke="#22d3ee" stroke-width="1.5" fill="none"/>
  <circle cx="100" cy="165" r="6" stroke="#22d3ee" stroke-width="1.5" fill="none"/>
  <circle cx="155" cy="155" r="6" stroke="#22d3ee" stroke-width="1.5" fill="none"/>
  <line x1="51" y1="155" x2="94" y2="165" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
  <line x1="106" y1="165" x2="149" y2="155" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>

  <!-- Play / real-time indicator -->
  <polygon points="152,35 152,48 162,41.5" fill="#22d3ee" opacity="0.7"/>
</svg>
