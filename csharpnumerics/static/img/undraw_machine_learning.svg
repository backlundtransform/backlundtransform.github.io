<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Neural network layers -->
  
  <!-- Input layer (3 nodes) -->
  <circle cx="50" cy="70" r="8" fill="#1c7ed6" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="50" cy="100" r="8" fill="#1c7ed6" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="50" cy="130" r="8" fill="#1c7ed6" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Hidden layer (4 nodes) -->
  <circle cx="100" cy="60" r="8" fill="#2e8555" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="100" cy="90" r="8" fill="#2e8555" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="100" cy="110" r="8" fill="#2e8555" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="100" cy="140" r="8" fill="#2e8555" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Output layer (2 nodes) -->
  <circle cx="150" cy="85" r="8" fill="#f56e28" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="150" cy="115" r="8" fill="#f56e28" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Connections (sample) -->
  <line x1="58" y1="70" x2="92" y2="60" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <line x1="58" y1="100" x2="92" y2="90" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <line x1="58" y1="100" x2="92" y2="110" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <line x1="58" y1="130" x2="92" y2="140" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  
  <line x1="108" y1="90" x2="142" y2="85" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <line x1="108" y1="110" x2="142" y2="115" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <line x1="108" y1="60" x2="142" y2="85" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <line x1="108" y1="140" x2="142" y2="115" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Layer labels -->
  <text x="38" y="30" font-family="sans-serif" font-size="9" fill="currentColor" opacity="0.6">Input</text>
  <text x="85" y="30" font-family="sans-serif" font-size="9" fill="currentColor" opacity="0.6">Hidden</text>
  <text x="135" y="30" font-family="sans-serif" font-size="9" fill="currentColor" opacity="0.6">Output</text>
</svg>
